name: Federation Catalog Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: catalog-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Validate catalog
        run: |
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python -m py_compile scripts/validate_repository_catalog.py
          python scripts/validate_repository_catalog.py

      - name: Confirm validation is non-mutating
        run: git diff --exit-code && test -z "$(git status --porcelain)"
