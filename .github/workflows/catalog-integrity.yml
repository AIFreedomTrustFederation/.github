name: Federation Catalog Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: catalog-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Validate catalog
        run: |
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python -m py_compile scripts/validate_repository_catalog.py
          python scripts/validate_repository_catalog.py

      - name: Confirm validation is non-mutating
        run: git diff --exit-code && test -z "$(git status --porcelain)"
